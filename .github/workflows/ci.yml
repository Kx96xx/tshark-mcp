name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # The oldest dependency versions pyproject.toml allows.
          - python-version: "3.10"
            deps: "minimum"
    name: test (${{ matrix.python-version }}, ${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4

      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pin the minimum supported mcp and pydantic
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install 'mcp==2.1.0' 'pydantic==2.12.0'
          python -m pip show mcp pydantic | grep -E '^(Name|Version)'

      - name: Run tests
        run: python -m pytest -v

      - name: Task-success evals (scripted driver, results as an artifact)
        if: matrix.python-version == '3.12'
        run: python -m evals --json evals-results.json

      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: evals-results
          path: evals-results.json
          if-no-files-found: ignore

      - name: Dump dissection of the synthetic captures (diagnostics on failure)
        if: failure()
        run: |
          python tests/pcapgen.py /tmp/pcaps
          tshark -n -r /tmp/pcaps/sigtran.pcap -V -Y "frame.number == 3"
          tshark -n -r /tmp/pcaps/sigtran.pcap -T json --no-duplicate-keys -Y "frame.number == 3"
          capinfos -M /tmp/pcaps/diameter.pcap

      - name: Server starts and refuses to run without an allowlist
        run: |
          if tshark-mcp; then echo "expected a non-zero exit"; exit 1; fi
          tshark-mcp --version

  docker:
    # Builds the image (never pushed anywhere) and runs the stdio checks inside it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the eval harness on the host (it writes the synthetic captures)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Build the image
        run: docker build -t tshark-mcp:ci .

      - name: Image checks (non-root, tshark version, refusal without --allow-dir, healthcheck)
        run: python -m pytest -v tests/test_docker.py

      - name: Every task-success scenario over stdio inside the container
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          python -m evals --captures "$RUNNER_TEMP/captures" --server-dir /captures -- \
            docker run --rm -i --read-only --tmpfs /tmp --cap-drop ALL --network none \
              --security-opt no-new-privileges --memory 2g \
              -v "$RUNNER_TEMP/captures:/captures:ro" tshark-mcp:ci

      - name: Healthcheck reports healthy
        run: |
          docker run -d --name hc --read-only --tmpfs /tmp --cap-drop ALL --network none \
            --health-interval 2s --health-start-period 1s -i tshark-mcp:ci
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' hc); echo "$s"
            [ "$s" = healthy ] && break; sleep 2
          done
          docker rm -f hc
          [ "$s" = healthy ]

  mcpb:
    # Builds the MCPB desktop bundle (never published) and starts the built bundle over stdio.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Manifest is current (version, tools list)
        run: python mcpb/build.py --check

      - name: Generated tool tables, tool lists and counts are current
        run: python scripts/gen_docs.py --check

      - name: Validate and pack the bundle
        run: |
          python mcpb/build.py
          npx -y @anthropic-ai/mcpb@2.1.2 validate build/mcpb/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack build/mcpb build/tshark-mcp.mcpb
          unzip -l build/tshark-mcp.mcpb | grep -E 'manifest.json|server/main.py|src/tshark_mcp/server.py'

      - name: The built bundle answers over stdio
        env:
          TSHARK_MCP_TEST_BUNDLE: "1"
        run: python -m pytest -v tests/test_mcpb.py

  plugin:
    # Validates the Claude Code plugin and its marketplace entry, and starts the server with
    # the plugin's own arguments over stdio.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package, test dependencies and the claude CLI (validate only, no login)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          npm install -g @anthropic-ai/claude-code@2.1.302

      - name: claude plugin validate (plugin and marketplace)
        run: |
          claude plugin validate ./plugin
          claude plugin validate .

      - name: Plugin tests
        run: python -m pytest -v tests/test_plugin.py
