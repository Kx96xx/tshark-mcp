name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # The oldest dependency versions pyproject.toml allows.
          - python-version: "3.10"
            deps: "minimum"
    name: test (${{ matrix.python-version }}, ${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4

      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pin the minimum supported mcp and pydantic
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install 'mcp==2.1.0' 'pydantic==2.12.0'
          python -m pip show mcp pydantic | grep -E '^(Name|Version)'

      - name: Run tests
        run: python -m pytest -v

      - name: Task-success evals (scripted driver, results as an artifact)
        if: matrix.python-version == '3.12'
        run: python -m evals --json evals-results.json

      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: evals-results
          path: evals-results.json
          if-no-files-found: ignore

      - name: Dump dissection of the synthetic captures (diagnostics on failure)
        if: failure()
        run: |
          python tests/pcapgen.py /tmp/pcaps
          tshark -n -r /tmp/pcaps/sigtran.pcap -V -Y "frame.number == 3"
          tshark -n -r /tmp/pcaps/sigtran.pcap -T json --no-duplicate-keys -Y "frame.number == 3"
          capinfos -M /tmp/pcaps/diameter.pcap

      - name: Server starts and refuses to run without an allowlist
        run: |
          if tshark-mcp; then echo "expected a non-zero exit"; exit 1; fi
          tshark-mcp --version
