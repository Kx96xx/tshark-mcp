name: Publish to PyPI and the MCP Registry

# Runs only when a GitHub release is published. Uses PyPI trusted publishing (OIDC), so
# there is no API token to store: the "pypi" environment and the publisher registration on
# pypi.org (owner Kx96xx, repository tshark-mcp, workflow publish.yml, environment pypi)
# are the only configuration. After the upload, the registry job publishes server.json to
# registry.modelcontextprotocol.io with GitHub OIDC (namespace io.github.Kx96xx/*); the
# registry checks the PyPI README of that version for the mcp-name marker.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Check server.json (MCP registry) carries the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python - "$tag" <<'PY'
          import json, sys
          tag = sys.argv[1]
          s = json.load(open("server.json"))
          versions = {s["version"], *(p["version"] for p in s["packages"])}
          print("server.json versions:", versions, "tag:", tag)
          sys.exit(0 if versions == {tag} else 1)
          PY
          grep -q "mcp-name: $(python -c 'import json; print(json.load(open("server.json"))["name"])')" README.md

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          tshark-mcp --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/tshark-mcp-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      # Pinned release and its archive digest (registry_1.8.7_checksums.txt); bump both together.
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$archive"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --help | head -1

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        # PyPI's JSON API can lag the upload by a minute; retry before failing.
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish server.json && exit 0
            echo "attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
