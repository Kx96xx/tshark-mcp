name: Publish to PyPI

# Runs only when a GitHub release is published. Uses PyPI trusted publishing (OIDC), so
# there is no API token to store: the "pypi" environment and the publisher registration on
# pypi.org (owner Kx96xx, repository tshark-mcp, workflow publish.yml, environment pypi)
# are the only configuration.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          tshark-mcp --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/tshark-mcp-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
