[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. "tshark-mcp" there belongs to an unrelated project, so the
# package is published as tshark-mcp-server; the import name (tshark_mcp) and the command
# (tshark-mcp) are unchanged.
name = "tshark-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for analysing packet captures with tshark: Diameter, GTP, SIP, SIGTRAN, with hard safety limits"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karl Hulse" }]
requires-python = ">=3.10"
keywords = ["mcp", "tshark", "wireshark", "pcap", "diameter", "gtp", "sip", "sigtran", "telecom", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
# mcp 2.0 and older fail: 1.x has no FastMCP(version=...) and 2.0 rejects the structured
# output; models.py imports pydantic directly (ConfigDict on the result TypedDicts).
# The floor (mcp 2.1.0, pydantic 2.12.0) is tested in CI.
dependencies = ["mcp>=2.1", "pydantic>=2.12,<3", "typing-extensions>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "scapy>=2.5"]

[project.scripts]
tshark-mcp = "tshark_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Kx96xx/tshark-mcp"
Documentation = "https://github.com/Kx96xx/tshark-mcp/blob/main/docs/TOOLS.md"
Changelog = "https://github.com/Kx96xx/tshark-mcp/blob/main/CHANGELOG.md"
Source = "https://github.com/Kx96xx/tshark-mcp"
Issues = "https://github.com/Kx96xx/tshark-mcp/issues"
Releases = "https://github.com/Kx96xx/tshark-mcp/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:scapy.*", "ignore::DeprecationWarning:cryptography.*"]
